# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P3/8 (保持原样，配合后面的 SGCL)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8

  # [FCB] P4 Backbone: 增强纹理特征
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P4/16 (原 C3k2)

  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16

  # [FCB] P5 Backbone: 全局感知
  - [-1, 2, LGAF, [512, True]] # 6-P5/32 (原 C3k2)

  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32

  # [FCB] P5 Deep
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32 (原 C3k2)

  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13 (Neck 过渡层建议保持轻量，或者也换FCB)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  # =========================================================
  # [SGCL] 辅助监督模块
  # 放在 Layer 16 之后，直接监督 P3 的高分辨率特征
  # 这对检测微小裂缝至关重要
  # =========================================================
  - [-1, 1, SGCLStrip, []] # 17 (Aux Loss Layer)

  # 下采样路径
  - [-1, 1, Conv, [256, 3, 2]] # 18 (原17)
  - [[-1, 13], 1, Concat, [1]] # 19 (原18) -> cat Head P4

  # [FCB] Head P4 Fusion: 区分网裂/背景
  - [-1, 2, LGAF, [512, False]] # 20 (原19)

  - [-1, 1, Conv, [512, 3, 2]] # 21 (原20)
  - [[-1, 10], 1, Concat, [1]] # 22 (原21) -> cat Backbone P5

  # [FCB] Head P5 Fusion: 区分坑洼/阴影
  - [-1, 2, C3k2, [1024, True]] # 23 (原22)
  # 第一版,原本参数,卷积核=5
  - [[17, 20, 23], 1, L_MSSA, [256, "P3", 3, -2.2, -1.7]] # Layer 24 (精修后的 P3)
  - [[17, 20, 23], 1, L_MSSA, [512, "P4", 7, -2.2, -1.7]] # Layer 25 (精修后的 P4)
  - [[17, 20, 23], 1, L_MSSA, [1024, "P5", 9, -2.2, -1.7]] # Layer 26 (精修后的 P5)
  #   - [ [ 17, 20, 23 ], 1, L_MSMA, [ 256, "P3", 5, -2.2, -2.0 ] ] # Layer 24 (精修后的 P3)
  #   - [ [ 17, 20, 23 ], 1, L_MSMA, [ 512, "P4", 5, -2.2, -2.0 ] ] # Layer 25 (精修后的 P4)
  #   - [ [ 17, 20, 23 ], 1, L_MSMA, [ 1024, "P5", 5, -2.2, -2.0 ] ] # Layer 26 (精修后的 P5)

  # Detect 头
  # 注意：输入索引必须对应上面的 Layer ID
  # 17: P3 (SGCL output)
  # 20: P4 (FCB output)
  # 23: P5 (FCB output)
  - [[24, 25, 26], 1, Detect, [nc]]
